; DTN LoRa Hub firmware — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; Build:  pio run
; Flash:  pio run -t upload --upload-port COM11   (one board at a time)
; Serial: pio device monitor -p COM11
;
; Identical firmware is flashed to every hub — each derives a unique HUB_ID and
; SoftAP SSID suffix from its ESP32 eFuse MAC, so no per-device source edits.
; Region (IN865 / EU868 / US915) is stored in NVS and changeable over serial.
[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.12.0
board = heltec_wifi_lora_32_V3
framework = arduino
lib_deps =
    jgromes/RadioLib@^6.6.0
    olikraus/U8g2@^2.34.22
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -D DTN_FW_VERSION=2
    -D DTN_DEFAULT_REGION=0   ; 0=IN865 (Andhra/India) 1=EU868 2=US915
